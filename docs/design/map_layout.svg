<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <style>
    .bg { fill: #f6f1e7; }
    .wall { fill: none; stroke: #5b4636; stroke-width: 4; }
    .lowwall { stroke: #8a6f58; stroke-width: 3; }
    .yard { fill: #e7dcc4; stroke: none; }
    .bldg { fill: #c9b18f; stroke: #5b4636; stroke-width: 2; }
    .room { fill: #d9c4a3; stroke: #5b4636; stroke-width: 1.5; }
    .maru { fill: #b88e5f; stroke: #5b4636; stroke-width: 1; opacity: 0.85; }
    .locked { fill: #bfb6a8; stroke: #5b4636; stroke-width: 2; stroke-dasharray: 6 4; }
    .outer { fill: #d6cfc2; stroke: #5b4636; stroke-width: 2; }
    .label { font-size: 12px; fill: #2e2219; text-anchor: middle; }
    .zone { font-size: 13px; fill: #6b5444; text-anchor: middle; font-weight: 600; }
    .spot { fill: #b3261e; stroke: #fff; stroke-width: 1.5; }
    .spotnum { font-size: 10px; fill: #fff; text-anchor: middle; font-weight: 700; }
    .npc { fill: #1f5fa8; stroke: #fff; stroke-width: 1.5; }
    .meet { fill: none; stroke: #1f5fa8; stroke-width: 2; stroke-dasharray: 4 3; }
    .r-byeon { fill: none; stroke: #7a3fa0; stroke-width: 2.5; stroke-dasharray: 8 5; }
    .r-buni { fill: none; stroke: #2f8a4a; stroke-width: 2.5; stroke-dasharray: 3 4; }
    .legend { font-size: 12px; fill: #2e2219; }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="800"/>

